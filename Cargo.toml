[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/cli"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
apple = { path = "crates/apple" }
media = { path = "crates/media" }
app = { path = "crates/app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "signal", "io-util"] }
url = { version = "2", features = ["serde"] }

tokio-util = "0.7"
hex = "0.4"
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"
